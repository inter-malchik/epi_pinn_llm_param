name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # requirements.txt pins torch==2.8.0+cu128 — a CUDA build that lives only on
        # the PyTorch index and drags in ~3 GB of NVIDIA libraries. CI installs the
        # CPU build of the same version and everything else from requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)==' requirements.txt > /tmp/requirements.notorch.txt
          pip install -r /tmp/requirements.notorch.txt -r requirements-dev.txt

      - name: Run test suite with coverage
        run: |
          pytest --cov=agents --cov=utils --cov=formats --cov=config --cov=main_test --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true  # informational for now; tests are the gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)==' requirements.txt > /tmp/requirements.notorch.txt
          pip install -r /tmp/requirements.notorch.txt -r requirements-dev.txt

      - name: Run pylint (errors and fatals only, report only)
        run: |
          pylint --exit-zero --disable=all --enable=E,F agents utils formats config.py main_test.py
