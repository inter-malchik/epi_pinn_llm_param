[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
markers =
    slow: tests that train a PINN for many epochs or drive the whole entry point (deselect with '-m "not slow"')
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:torch
